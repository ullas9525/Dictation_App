# Standardized JVM args for portability (Adjust higher if your machine supports it)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.ndkVersion=28.0.13004108

# Disable incremental compilation to fix cross-drive path issues on Windows
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false

# [LOCAL ONLY] Uncomment and update path if you encounter "different roots" errors on Windows
