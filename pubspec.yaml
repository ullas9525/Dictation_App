name: voice_notes_app
description: A new Flutter project.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_sound: ^9.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  google_generative_ai: ^0.4.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  file_picker: ^8.0.0+1
  audioplayers: ^6.0.0
  flutter_markdown: ^0.7.1
  translator: ^1.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "launcher_icon" # can be true or a string with the desired file name
  ios: true
  image_path: "assets/icon.png" # path to your icon image
  min_sdk_android: 21
